name: NODE3 tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: atm_test
          POSTGRES_PASSWORD: test_only_ci
          POSTGRES_DB: atm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atm_test -d atm_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://atm_test:test_only_ci@127.0.0.1:5432/atm_test
