name: node3-atm-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: atm_local
      POSTGRES_DB: atm_local
      POSTGRES_PASSWORD: ${LOCAL_DATABASE_PASSWORD:?Ejecuta npm run setup:local}
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - atm-local-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atm_local -d atm_local"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres-integration:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: atm_local
      POSTGRES_DB: atm_integration
      POSTGRES_PASSWORD: ${LOCAL_DATABASE_PASSWORD:?Ejecuta npm run setup:integration}
    ports:
      - "127.0.0.1:55435:5432"
    volumes:
      - atm-integration-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atm_local -d atm_integration"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  atm-local-data:
  atm-integration-data:
